name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, windows-11-arm, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: ${{ matrix.os == 'windows-11-arm' && 'aarch64-pc-windows-msvc' || '' }}

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install Linux GUI & capture dependencies
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            libxcb1-dev \
            libxcb-shm0-dev \
            libxcb-randr0-dev \
            libdbus-1-dev \
            libpipewire-0.3-dev \
            libclang-dev \
            libxkbcommon-dev \
            libegl1-mesa-dev \
            libgl1-mesa-dev \
            libx11-dev \
            libxi-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxinerama-dev \
            xvfb

      - name: Check & Clippy all targets
        env:
          RUSTFLAGS: "-D warnings"
        run: |
          if [ "${{ matrix.os }}" = "windows-11-arm" ]; then
            cargo check --all-targets --target aarch64-pc-windows-msvc
            cargo clippy --all-targets --target aarch64-pc-windows-msvc -- -D warnings
          else
            cargo check --all-targets
            cargo clippy --all-targets -- -D warnings
          fi
        shell: bash

      - name: Run unit tests
        env:
          RUSTFLAGS: "-D warnings"
        run: |
          if [ "${{ matrix.os }}" = "windows-11-arm" ]; then
            cargo test --target aarch64-pc-windows-msvc
          else
            cargo test
          fi
        shell: bash

      - name: Smoke-test binary (Windows ARM64)
        if: matrix.os == 'windows-11-arm'
        env:
          RUSTFLAGS: "-D warnings"
        run: |
          cargo run --target aarch64-pc-windows-msvc -- --version
          cargo run --target aarch64-pc-windows-msvc -- --smoke-test

      - name: Smoke-test binary (macOS & Windows x64)
        if: matrix.os == 'macos-latest' || matrix.os == 'windows-latest'
        env:
          RUSTFLAGS: "-D warnings"
        run: |
          cargo run -- --version
          cargo run -- --smoke-test

      - name: Smoke-test binary under Xvfb (Linux VM)
        if: matrix.os == 'ubuntu-24.04'
        env:
          RUSTFLAGS: "-D warnings"
        run: |
          cargo build
          xvfb-run -a target/debug/shotcraft --version
          xvfb-run -a target/debug/shotcraft --smoke-test
