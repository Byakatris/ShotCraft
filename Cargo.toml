[package]
name = "shotcraft"
version = "0.6.2"
edition = "2024"
license = "MIT"
description = "Lightweight, fast cross-platform screenshot and annotation app in Rust"

[dependencies]
winit = "0.30"
egui = { version = "0.31", default-features = false }
egui-winit = { version = "0.31", default-features = false }
egui_glow = "0.31"
glutin = "0.32"
glutin-winit = "0.5"
raw-window-handle = "0.6"
glow = "0.16"
tray-icon = "0.19"
muda = "0.15"
global-hotkey = "0.6"
xcap = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
arboard = "3.4"
ab_glyph = "0.2"
dirs = "6.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

[profile.release.package.png]
opt-level = 3

[profile.release.package.flate2]
opt-level = 3

[profile.release.package.miniz_oxide]
opt-level = 3

[profile.release.package.image]
opt-level = 3
