name: Release (macOS, Windows, Linux)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Run unit tests
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo test

      - name: Build & Package macOS (.dmg)
        run: |
          chmod +x package_dmg.sh
          ./package_dmg.sh
          dist/ShotCraft.app/Contents/MacOS/ShotCraft --version
          dist/ShotCraft.app/Contents/MacOS/ShotCraft --smoke-test

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-macos
          path: dist/ShotCraft-v*.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Run unit tests
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo test

      - name: Build & Package Windows NSIS (.exe)
        shell: bash
        run: |
          chmod +x package_windows.sh
          ./package_windows.sh

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: dist/ShotCraft-v*-Setup.exe

  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux GUI & capture dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            libxcb1-dev \
            libxcb-shm0-dev \
            libxcb-randr0-dev \
            libdbus-1-dev \
            libpipewire-0.3-dev \
            libclang-dev \
            libxkbcommon-dev \
            libegl1-mesa-dev \
            libgl1-mesa-dev \
            libx11-dev \
            libxi-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxinerama-dev \
            xvfb

      - name: Run unit tests
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo test

      - name: Build & Package Linux (.deb and .tar.gz)
        run: |
          chmod +x package_linux.sh
          ./package_linux.sh
          xvfb-run -a target/release/shotcraft --version
          xvfb-run -a target/release/shotcraft --smoke-test

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: |
            dist/ShotCraft-v*-linux-amd64.deb
            dist/ShotCraft-v*-linux-x86_64.tar.gz

  publish-release:
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APP_VERSION="$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          SHORT_VER="$(echo "${APP_VERSION}" | awk -F. '{print $1"."$2}')"
          TAG="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] || [[ "${TAG}" != v* ]]; then
            TAG="v${APP_VERSION}"
          fi

          printf '%s\n' \
            "## ShotCraft ${TAG}" \
            "" \
            "Ultra-fast, lightweight (~1-3 MB) cross-platform screenshot & annotation app written in Rust." \
            "" \
            "### Direct Downloads" \
            "- **macOS (Apple Silicon):** \`ShotCraft-v${SHORT_VER}.dmg\`" \
            "- **Windows (x64 Installer):** \`ShotCraft-v${SHORT_VER}-Setup.exe\`" \
            "- **Linux (Ubuntu / Debian):** \`ShotCraft-v${SHORT_VER}-linux-amd64.deb\`" \
            "- **Linux (Universal x86_64):** \`ShotCraft-v${SHORT_VER}-linux-x86_64.tar.gz\`" \
            "" \
            "### Highlights" \
            "- Built-in **Auto-Updater** (menu bar tray & Settings -> Check / Update now)" \
            "- **50-step Undo/Redo**, 2-pass Gaussian **Blur** & **Pixelate**, vector **Step** numbering, **Screen Draw**" \
            "- Native HiDPI & mixed-DPI multi-monitor coordinates across macOS, Windows, and Linux" \
            "- Rotating \`shotcraft.log\` diagnostics & non-blocking OS notifications" \
            "- 10 UI languages (\`En, Uk, Es, Fr, De, Pl, It, Pt, Tr, Nl\`)" \
            > RELEASE_NOTES.md

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release edit "${TAG}" --title "ShotCraft ${TAG}" --notes-file RELEASE_NOTES.md
          else
            gh release create "${TAG}" --title "ShotCraft ${TAG}" --notes-file RELEASE_NOTES.md
          fi
          gh release upload "${TAG}" release_assets/* --clobber
          rm -f RELEASE_NOTES.md
