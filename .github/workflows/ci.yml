name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux GUI & capture dependencies
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            libxcb1-dev \
            libxcb-shm0-dev \
            libxcb-randr0-dev \
            libdbus-1-dev \
            libpipewire-0.3-dev \
            libclang-dev \
            libxkbcommon-dev \
            libegl1-mesa-dev \
            libgl1-mesa-dev \
            libx11-dev \
            libxi-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxinerama-dev \
            xvfb

      - name: Check all targets
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo check --all-targets

      - name: Run unit tests
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo test

      - name: Smoke-test binary (macOS & Windows)
        if: matrix.os != 'ubuntu-24.04'
        env:
          RUSTFLAGS: "-D warnings"
        run: |
          cargo run -- --version
          cargo run -- --smoke-test

      - name: Smoke-test binary under Xvfb (Linux VM)
        if: matrix.os == 'ubuntu-24.04'
        env:
          RUSTFLAGS: "-D warnings"
        run: |
          cargo build
          xvfb-run -a target/debug/shotcraft --version
          xvfb-run -a target/debug/shotcraft --smoke-test
