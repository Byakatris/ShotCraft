name: Release (macOS, Windows, Linux)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run unit tests
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo test

      - name: Build & Package macOS (.dmg)
        run: |
          chmod +x package_dmg.sh
          ./package_dmg.sh
          dist/ShotCraft.app/Contents/MacOS/ShotCraft --version
          dist/ShotCraft.app/Contents/MacOS/ShotCraft --smoke-test

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-macos
          path: dist/ShotCraft-v*.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run unit tests
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo test

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Build & Package Windows NSIS (.exe)
        shell: bash
        run: |
          export PATH="/c/Program Files (x86)/NSIS:/c/ProgramData/chocolatey/bin:${PATH}"
          chmod +x package_windows.sh
          ./package_windows.sh

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: dist/ShotCraft-v*-Setup.exe

  build-windows-arm64:
    runs-on: windows-11-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable (ARM64 MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run unit tests (ARM64)
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo test --target aarch64-pc-windows-msvc

      - name: Install NSIS
        shell: bash
        run: |
          if ! command -v makensis >/dev/null 2>&1 && [ ! -x "/c/Program Files (x86)/NSIS/makensis.exe" ]; then
            if command -v choco >/dev/null 2>&1; then
              choco install nsis -y --no-progress
            else
              winget install --id NSIS.NSIS -e --silent --accept-package-agreements --accept-source-agreements
            fi
          fi

      - name: Build & Package Windows ARM64 NSIS (.exe)
        shell: bash
        run: |
          export PATH="/c/Program Files (x86)/NSIS:/c/Program Files/NSIS:/c/ProgramData/chocolatey/bin:${PATH}"
          chmod +x package_windows.sh
          WIN_ARCH=arm64 ./package_windows.sh
          powershell -NoProfile -Command '$b=[IO.File]::ReadAllBytes("target/aarch64-pc-windows-msvc/release/shotcraft.exe"); $pe=[BitConverter]::ToInt32($b,0x3c); $m=[BitConverter]::ToUInt16($b,$pe+4); Write-Host ("PE Machine: 0x{0:X4}" -f $m); if($m -ne 0xAA64){ exit 1 }'

      - name: Upload Windows ARM64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-windows-arm64
          path: dist/ShotCraft-v*-arm64-Setup.exe

  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install Linux GUI & capture dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            libxcb1-dev \
            libxcb-shm0-dev \
            libxcb-randr0-dev \
            libdbus-1-dev \
            libpipewire-0.3-dev \
            libclang-dev \
            libxkbcommon-dev \
            libegl1-mesa-dev \
            libgl1-mesa-dev \
            libx11-dev \
            libxi-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxinerama-dev \
            xvfb

      - name: Run unit tests
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo test

      - name: Build & Package Linux (.deb and .tar.gz)
        run: |
          chmod +x package_linux.sh
          ./package_linux.sh
          dpkg-deb --info dist/ShotCraft-v*-linux-amd64.deb
          xvfb-run -a target/release/shotcraft --version
          xvfb-run -a target/release/shotcraft --smoke-test

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: |
            dist/ShotCraft-v*-linux-amd64.deb
            dist/ShotCraft-v*-linux-x86_64.tar.gz

  publish-release:
    needs: [build-macos, build-windows, build-windows-arm64, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APP_VERSION="$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          TAG="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${TAG}" != "v${APP_VERSION}" ]; then
            echo "ERROR: Tag ${TAG} does not match Cargo.toml version v${APP_VERSION}" >&2
            exit 1
          fi
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] || [[ "${TAG}" != v* ]]; then
            TAG="v${APP_VERSION}"
          fi

          (cd release_assets && sha256sum * > SHA256SUMS.txt)

          printf '%s\n' \
            "## ShotCraft ${TAG}" \
            "" \
            "Ultra-fast, lightweight (~1-3 MB) cross-platform screenshot & annotation app written in Rust." \
            "" \
            "### Direct Downloads" \
            "- **macOS (Apple Silicon):** \`ShotCraft-v${APP_VERSION}.dmg\`" \
            "- **Windows (x64 Installer):** \`ShotCraft-v${APP_VERSION}-Setup.exe\`" \
            "- **Windows (ARM64 Installer):** \`ShotCraft-v${APP_VERSION}-arm64-Setup.exe\`" \
            "- **Linux (Ubuntu / Debian):** \`ShotCraft-v${APP_VERSION}-linux-amd64.deb\`" \
            "- **Linux (Universal x86_64):** \`ShotCraft-v${APP_VERSION}-linux-x86_64.tar.gz\`" \
            "- **Checksums:** \`SHA256SUMS.txt\`" \
            "" \
            "### Highlights" \
            "- New pure-vector **Apple Liquid Glass** app icon (\`app_icon.svg\`, \`.icns\`, \`.ico\`, \`.png\`)" \
            "- Tight-stride dashed mode (\`Cmd/Ctrl\`) for **Pen**, **Marker**, **Line**, and **Arrow**; 2-point independent move handles for **Text** callouts" \
            "- Hardened **Auto-Updater** with fail-closed FIPS 180-4 SHA-256 verification against \`SHA256SUMS.txt\` (tray & Settings -> Check / Update now)" \
            "- **50-step Undo/Redo**, 2-pass Gaussian **Blur** & **Pixelate**, vector **Step** numbering, **Screen Draw**" \
            "- Native HiDPI & mixed-DPI multi-monitor coordinates across macOS, Windows, and Linux" \
            "- Rotating \`shotcraft.log\` diagnostics & non-blocking OS notifications" \
            "- 10 UI languages (\`En, Uk, Es, Fr, De, Pl, It, Pt, Tr, Nl\`)" \
            > RELEASE_NOTES.md

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release edit "${TAG}" --title "ShotCraft ${TAG}" --notes-file RELEASE_NOTES.md
          else
            gh release create "${TAG}" --title "ShotCraft ${TAG}" --notes-file RELEASE_NOTES.md
          fi
          gh release upload "${TAG}" release_assets/* --clobber
          rm -f RELEASE_NOTES.md
