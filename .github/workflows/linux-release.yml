name: Build & Publish Linux Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'package_linux.sh'
      - '.github/workflows/linux-release.yml'

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux GUI & capture dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            libxcb1-dev \
            libxcb-shm0-dev \
            libxcb-randr0-dev \
            libdbus-1-dev \
            libpipewire-0.3-dev \
            libclang-dev \
            libxkbcommon-dev \
            libegl1-mesa-dev \
            libgl1-mesa-dev \
            libx11-dev \
            libxi-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxinerama-dev

      - name: Run tests
        run: cargo test

      - name: Build & Package Linux (.deb and .tar.gz)
        run: |
          chmod +x package_linux.sh
          ./package_linux.sh

      - name: Upload Linux packages to GitHub Release v0.5.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v0.5.0 \
            dist/ShotCraft-v0.5-linux-amd64.deb \
            dist/ShotCraft-v0.5-linux-x86_64.tar.gz \
            --clobber
